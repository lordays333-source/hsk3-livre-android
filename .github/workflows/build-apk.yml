name: Criar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: gradle assembleRelease --no-daemon

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk HSK3-Livre.apk

      - name: Guardar APK (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: HSK3-Livre-apk
          path: HSK3-Livre.apk

      - name: Publicar na página Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: HSK 3 Livre v1.${{ github.run_number }}
          body: Toca em HSK3-Livre.apk para descarregar e instalar no telemóvel.
          files: HSK3-Livre.apk
