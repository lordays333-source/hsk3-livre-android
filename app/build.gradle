plugins {
    id 'com.android.application'
}

android {
    namespace 'mz.hsk3livre'
    compileSdk 34

    defaultConfig {
        applicationId 'mz.hsk3livre'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Assinada com a chave de debug para poder ser instalada diretamente.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
